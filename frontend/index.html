<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#101819" />
<link rel="stylesheet" href="/style.css" />
<title>GONG</title>
</head>
<body>
<main class="instrument">
    <header class="header"><h1>GONG<span>.</span></h1><span class="status">READY</span></header>
    <section class="looper" aria-label="Looper">
        <div class="hero">
            <svg class="rings" viewBox="0 0 320 320" aria-hidden="true">
                <circle cx="160" cy="160" r="148" />
                <circle class="inner-ring" cx="160" cy="160" r="136" />
            </svg>
            <button id="record" class="center-button" type="button" disabled aria-describedby="engine-status">
                <span class="time">00:00</span><span class="minor">FIRST TAKE</span>
                <span class="record-action"><span class="record-dot" aria-hidden="true"></span> RECORD</span>
            </button>
        </div>
        <p class="loop-counter">↻ 0 completed loops</p>
        <p class="hint">One idea. One layer at a time.</p>
        <div class="controls" role="group" aria-label="Take controls">
            <button id="listen" type="button" disabled><span aria-hidden="true">▷</span> Listen</button>
            <button id="retry" type="button" disabled><span aria-hidden="true">↶</span> Retry</button>
            <button id="keep" class="primary" type="button" disabled><span aria-hidden="true">✓</span> Keep</button>
            <button id="mix" type="button" disabled><span aria-hidden="true">◎</span> Mix</button>
        </div>
        <p id="engine-status" class="engine-status">Recording and playback will be available once the audio engine is connected.</p>
    </section>
    <footer class="session-meta" aria-label="Session"><span>BASE <strong>—</strong></span><span><strong>0</strong> merges</span></footer>
    <details class="audio-tests">
        <summary>Audio tests <span aria-hidden="true">+</span></summary>
        <div class="test-content">
            <section class="test-section" aria-labelledby="permission-title">
                <h2 id="permission-title">Microphone access</h2>
                <button id="test-microphone" type="button">Test microphone</button>
                <p id="microphone-status" role="status">Microphone not tested yet.</p>
            </section>
            <section class="test-section" aria-labelledby="output-title">
                <button id="start-output" type="button">Start test tone</button>
                <button id="stop-output" type="button" disabled>Stop output</button>
                <p id="output-status" role="status">Output stopped.</p>
            </section>
        </div>
    </details>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
